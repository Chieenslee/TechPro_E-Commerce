<!-- Ambient Background Glow -->
<div class="absolute inset-0 z-0 pointer-events-none flex justify-center items-center">
<div class="w-[600px] h-[600px] bg-error/10 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-[800px] text-center gap-lg">
<!-- Error Visual Representation -->
<div class="relative flex justify-center items-center">
<!-- Glassmorphic Container for Icon -->
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-surface-container/30 backdrop-blur-xl border border-error/20 flex justify-center items-center shadow-[0_0_40px_rgba(255,180,171,0.1)] relative">
<!-- Glitch/Disconnect Icon -->
<span class="material-symbols-outlined text-6xl md:text-8xl text-error" style="font-variation-settings: 'FILL' 1;">
                    wifi_off
                </span>
<!-- Orbiting/Decorative Elements -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-error rounded-full shadow-[0_0_15px_rgba(255,180,171,0.8)] opacity-50"></div>
<div class="absolute bottom-4 right-0 translate-x-1/2 w-2 h-2 bg-on-surface-variant rounded-full opacity-30"></div>
<div class="absolute top-1/2 left-0 -translate-x-1/2 w-3 h-3 bg-error/40 rounded-full"></div>
</div>
<!-- Abstract Circuit Lines (CSS) -->
<div class="absolute inset-0 pointer-events-none -z-10">
<div class="absolute top-1/2 left-[-50px] w-[100px] h-[1px] bg-gradient-to-r from-transparent to-error/30"></div>
<div class="absolute top-1/2 right-[-50px] w-[100px] h-[1px] bg-gradient-to-l from-transparent to-error/30"></div>
<div class="absolute top-[-50px] left-1/2 w-[1px] h-[100px] bg-gradient-to-b from-transparent to-error/30"></div>
</div>
</div>

<div class="flex flex-col gap-base max-w-[600px]">
<!-- Status Badge -->
<div class="flex justify-center mb-sm">
<div class="flex items-center gap-2 bg-error-container/20 border border-error/30 rounded-full px-4 py-1.5">
<span class="w-2 h-2 rounded-full bg-error animate-pulse"></span>
<span class="font-label-sm text-label-sm text-error uppercase tracking-widest">Lỗi Hệ Thống 503</span>
</div>
</div>
<!-- Headline -->
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">Hệ Thống Mất Kết Nối</h1>
<!-- Description -->
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">
                Máy chủ hiện đang quá tải hoặc gặp sự cố đường truyền dữ liệu. Vui lòng thử lại sau vài phút.
            </p>
</div>
<!-- Call to Action -->
<div class="mt-md flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
<button class="bg-primary/10 text-primary hover:bg-primary/20 border border-primary/30 hover:border-primary/50 transition-all duration-300 rounded-lg px-8 py-4 font-label-md text-label-md flex items-center justify-center gap-2 group shadow-[0_0_20px_rgba(185,199,228,0.05)] hover:shadow-[0_0_30px_rgba(185,199,228,0.1)]">
<span class="material-symbols-outlined text-[20px] group-hover:rotate-180 transition-transform duration-500">
                    refresh
                </span>
                Thử kết nối lại
            </button>
<button class="bg-transparent text-on-surface-variant hover:text-on-surface border border-outline-variant hover:border-outline transition-colors duration-200 rounded-lg px-8 py-4 font-label-md text-label-md flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">
                    support_agent
                </span>
                Liên hệ hỗ trợ
            </button>
</div>
<!-- Technical Diagnostics (Optional Details) -->
<div class="mt-xl w-full max-w-[400px] border border-outline-variant/30 bg-surface-container-low rounded-lg p-md text-left">

</div>
