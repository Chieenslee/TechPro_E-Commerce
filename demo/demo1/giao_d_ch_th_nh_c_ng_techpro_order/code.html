<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
<div class="w-full max-w-2xl bg-[#0F1F39] rounded-xl border border-white/10 p-8 md:p-12 flex flex-col items-center text-center shadow-[0_8px_32px_rgba(185,199,228,0.05)] backdrop-blur-xl">

<div class="w-24 h-24 rounded-full bg-primary/10 flex items-center justify-center mb-8 border border-primary/20 shadow-[0_0_20px_rgba(185,199,228,0.2)]">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                check_circle
            </span>
</div>
<!-- Thank You Message -->
<h1 class="font-headline-lg text-headline-lg text-primary mb-4 tracking-tight">Order Confirmed</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-md">
            Thank you for your purchase. Your order has been successfully placed and is now being processed with precision.
        </p>
<!-- Order Details Card -->
<div class="w-full bg-surface-container rounded-lg border border-outline-variant/30 p-6 mb-8 text-left">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-outline-variant/20 pb-4 mb-4 gap-4">
<div>
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-1 uppercase tracking-wider">Order Number</span>
<span class="font-headline-md text-headline-md text-on-surface tracking-wider">#TP-2024-89012</span>
</div>
<div class="md:text-right">
<span class="font-label-sm text-label-sm text-on-surface-variant block mb-1 uppercase tracking-wider">Estimated Delivery</span>
<span class="font-body-lg text-body-lg text-primary">Oct 24 - Oct 26</span>
</div>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">local_shipping</span>
<span class="font-body-md text-body-md text-on-surface-variant">We will send a confirmation email with tracking details shortly.</span>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
<button class="px-8 py-3 bg-[#00FFFF] text-[#050B14] font-label-md text-label-md rounded shadow-[0_0_15px_rgba(0,255,255,0.2)] hover:shadow-[0_0_25px_rgba(0,255,255,0.4)] transition-all duration-200">
                Track Order
            </button>
<button class="px-8 py-3 bg-transparent text-on-surface border border-outline font-label-md text-label-md rounded hover:bg-surface-variant transition-colors duration-200">
                Continue Shopping
            </button>
