<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Subtle grid background for deep tech feel */
        .tech-grid-bg {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(68, 71, 77, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(68, 71, 77, 0.1) 1px, transparent 1px);
        }
        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md tech-grid-bg p-margin-mobile md:p-margin-desktop">
<!-- Ambient Glow Effects -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Main Verification Card -->
<main class="w-full max-w-[480px] relative z-10">
<!-- Glassmorphic Container -->
<div class="bg-surface-container/60 backdrop-blur-xl border border-outline-variant/30 rounded-xl p-md md:p-lg shadow-2xl shadow-primary/5 flex flex-col items-center">
<!-- Header/Icon -->
<div class="w-16 h-16 rounded-full bg-surface border border-outline-variant/50 flex items-center justify-center mb-md shadow-inner">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="encrypted">encrypted</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm text-center">Xác Minh Danh Tính</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-lg px-xs">
                Mã xác thực đã được gửi đến thiết bị đầu cuối của bạn. Vui lòng nhập mã để tiếp tục truy cập.
            </p>
<!-- OTP Input Group -->
<div class="flex gap-sm justify-center w-full mb-lg" dir="ltr">
<input class="w-12 h-14 bg-surface-dim border border-outline-variant/50 rounded text-center font-headline-md text-headline-md text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 bg-surface-dim border border-outline-variant/50 rounded text-center font-headline-md text-headline-md text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value="0"/>
<input class="w-12 h-14 bg-surface-dim border border-outline-variant/50 rounded text-center font-headline-md text-headline-md text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" inputmode="numeric" maxlength="1" type="text" value="4"/>
<input autofocus="" class="w-12 h-14 bg-surface-dim border border-primary border-b-2 text-center font-headline-md text-headline-md text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors shadow-[0_0_10px_rgba(185,199,228,0.1)]" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-12 h-14 bg-surface-dim border border-outline-variant/50 rounded text-center font-headline-md text-headline-md text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" inputmode="numeric" maxlength="1" type="text"/>
<input class="w-12 h-14 bg-surface-dim border border-outline-variant/50 rounded text-center font-headline-md text-headline-md text-primary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors" inputmode="numeric" maxlength="1" type="text"/>
</div>
<!-- Meta Information (Timer & Resend) -->
<div class="flex justify-between items-center w-full mb-lg px-xs">
<div class="flex items-center gap-xs text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[18px]" data-icon="timer">timer</span>
<span>02:45</span>
</div>
<button class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors duration-200 focus:outline-none" type="button">
                    Gửi lại mã
                </button>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded hover:bg-primary-fixed transition-all duration-200 shadow-lg shadow-primary/10 flex justify-center items-center gap-sm" type="button">
                XÁC NHẬN
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>

<div class="mt-md flex items-center gap-xs opacity-60 justify-center">
<span class="material-symbols-outlined text-[14px]" data-icon="verified_user">verified_user</span>
