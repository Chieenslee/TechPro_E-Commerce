name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML
        shell: bash
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].each { |file| YAML.load_file(file); puts \"validated #{file}\" }"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  database:
    name: Database scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SQL assets
        shell: bash
        run: |
          test -s database/schema.sql
          test -s database/seed.sql
          grep -q "CREATE TABLE dbo.Products" database/schema.sql
          grep -q "CREATE TABLE dbo.Orders" database/schema.sql
          grep -q "CREATE TABLE dbo.Users" database/schema.sql
          grep -q "CREATE TABLE dbo.OrderItems" database/schema.sql
          grep -q "CREATE INDEX IX_Products_Category" database/schema.sql
          grep -q "INSERT INTO dbo.Products" database/seed.sql
          grep -q "INSERT INTO dbo.Users" database/seed.sql
